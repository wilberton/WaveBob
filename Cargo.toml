[package]
name = "wavebob"
version = "0.1.0"
edition = "2024"
publish = false
description = "A command-driven waveform and multitrack editor"
default-run = "wavebob"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:png", "dep:rfd", "audio-output"]
audio-output = ["dep:cpal"]

[[bin]]
name = "wavebob"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "wavebob-headless"
path = "src/bin/headless.rs"

[[bin]]
name = "wavebob-mcp"
path = "src/bin/mcp.rs"

[dependencies]
eframe = { version = "=0.37.0", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = {version="1",features=["float_roundtrip"]}
uuid = { version = "1", features = ["v4"] }
interprocess = "2.4"
directories = "6"
png = { version = "0.18", optional = true }
tempfile = "3"
rmcp = { version = "=3.7.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt", "sync"] }
base64 = "0.23"
hound = "=3.5.1"
symphonia = {version = "=0.6.1", default-features = false, features = ["mp3", "id3v1", "id3v2"]}
rfd = { version = "0.17", optional = true }
cpal = {version="=0.18.2",optional=true}
rtrb = "=0.4.0"
mp3lame-sys = {version="=0.1.11",default-features=false}

[dev-dependencies]
tempfile = "3"
rmcp = { version = "=3.7.0", default-features = false, features = ["client", "transport-child-process"] }

[profile.release]
lto = "thin"
strip = true
