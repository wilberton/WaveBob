[package]
name = "wavebob"
version = "0.1.0"
edition = "2024"
publish = false
description = "A command-driven waveform and multitrack editor"
default-run = "wavebob"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:png", "dep:tempfile", "dep:rfd"]

[[bin]]
name = "wavebob"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "wavebob-headless"
path = "src/bin/headless.rs"

[[bin]]
name = "wavebob-mcp"
path = "src/bin/mcp.rs"

[dependencies]
eframe = { version = "=0.37.0", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
interprocess = "2.4"
directories = "6"
png = { version = "0.18", optional = true }
tempfile = { version = "3", optional = true }
rmcp = { version = "=3.7.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt", "sync"] }
base64 = "0.23"
hound = "=3.5.1"
rfd = { version = "0.17", optional = true }

[dev-dependencies]
tempfile = "3"
rmcp = { version = "=3.7.0", default-features = false, features = ["client", "transport-child-process"] }

[profile.release]
lto = "thin"
strip = true
