name: Native release kits
on:
  workflow_dispatch:
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev libgl1-mesa-dev libasound2-dev xvfb weston
      - name: Test device-free commands and MP3 workflow
        run: cargo test --locked --no-default-features --all-targets
      - name: Package native GUI, device-free runners, source and notices
        run: python scripts/package-release.py
      - name: Smoke-check shipped GUI, headless and MCP binaries
        if: runner.os != 'Linux'
        shell: bash
        run: python scripts/smoke-release.py dist/*.zip --out .tools/release-smoke --gui
      - name: Smoke-check shipped binaries on Linux X11
        if: runner.os == 'Linux'
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s '-screen 0 1920x1080x24' python scripts/smoke-release.py dist/*.zip --out .tools/release-x11 --gui
      - name: Smoke-check shipped GUI on Linux Wayland
        if: runner.os == 'Linux'
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/wavebob-wayland"
          mkdir -m 700 -p "$XDG_RUNTIME_DIR"
          export WAYLAND_DISPLAY=wavebob-test
          weston --backend=headless --renderer=pixman --socket="$WAYLAND_DISPLAY" --idle-time=0 --width=1920 --height=1080 > .tools/weston.log 2>&1 &
          weston_pid=$!
          trap 'kill "$weston_pid"' EXIT
          for attempt in {1..60}; do
            test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" && break
            sleep 0.1
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          unset DISPLAY
          python scripts/smoke-release.py dist/*.zip --out .tools/release-wayland --gui
      - name: Retain native capture and workflow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WaveBob-native-checks-${{ runner.os }}-${{ runner.arch }}
          path: |
            .tools/release-*/smoke-result.json
            .tools/release-*/gui/*.png
            .tools/release-*/gui-native.log
            .tools/weston.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: WaveBob-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error
