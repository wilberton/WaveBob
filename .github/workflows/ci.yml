name: Rust
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux windowing dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libgl1-mesa-dev libasound2-dev
      - run: cargo fmt --all --check
      - name: Lint headless without GUI dependencies
        run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
      - name: Test headless without a window or audio device
        run: cargo test --locked --no-default-features --all-targets
      - name: Build standalone headless and MCP runners
        run: cargo build --locked --release --no-default-features --bin wavebob-headless --bin wavebob-mcp
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release
